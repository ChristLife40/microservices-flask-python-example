apiVersion: v1
kind: Service
metadata:
  name: video-service-svc
spec:
  selector:
    app: video-service
  ports:
    - port: 5013
      targetPort: 5013
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-service
  template:
    metadata:
      labels:
        app: video-service
    spec:
      containers:
        - name: video-service
          image: <dockerhub-user>/video-service:v1
          ports:
            - containerPort: 5013
          env:
            - name: SQLALCHEMY_DATABASE_URI
              value: "mysql://root:123456@mysql-video-service:3306/video_service"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: db-secrets, key: secret-key }
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: auth-service-url }
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "200m" }
