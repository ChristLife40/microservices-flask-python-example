apiVersion: v1
kind: Service
metadata:
  name: mysql-video-service
spec:
  ports:
  - port: 3306
    targetPort: 3306
  clusterIP: None
  selector:
    app: mysql-video
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-video
spec:
  serviceName: "mysql-video-service"
  replicas: 1
  selector:
    matchLabels:
      app: mysql-video
  template:
    metadata:
      labels:
        app: mysql-video
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        args: ["--default-authentication-plugin=mysql_native_password"]
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: mysql-root-password
        - name: MYSQL_DATABASE
          value: "video_service"
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
        resources:
          requests: { memory: "256Mi", cpu: "100m" }
          limits:   { memory: "512Mi", cpu: "250m" }
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi