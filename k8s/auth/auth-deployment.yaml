apiVersion: v1
kind: Service
metadata:
  name: auth-service-svc
spec:
  selector:
    app: auth-service
  ports:
    - port: 5012
      targetPort: 5012
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: <dockerhub-user>/auth-service:v1
          ports:
            - containerPort: 5012
          env:
            - name: SQLALCHEMY_DATABASE_URI
              value: "mysql://root:123456@mysql-auth-service:3306/auth_service"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: db-secrets, key: secret-key }
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: auth-service-url }
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "200m" }
