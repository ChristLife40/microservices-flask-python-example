name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push auth-service
      uses: docker/build-push-action@v5
      with:
        context: ./auth_service
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:v1

    - name: Build and push video-service
      uses: docker/build-push-action@v5
      with:
        context: ./video_service
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/video-service:${{ github.sha }}
          ${{ secrets.DOCKERHUB_USERNAME }}/video-service:v11